# ALB (L7) 로 frontend 외부 노출
# AWS Load Balancer Controller 가 public 서브넷(kubernetes.io/role/elb)에 ALB 생성
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing   # 인터넷용
    alb.ingress.kubernetes.io/target-type: ip           # 파드 IP 로 직접 전달
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/load-balancer-name: std07-lab-company-alb
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
